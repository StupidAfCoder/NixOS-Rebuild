/* Compact revision: content-sized panels, smaller glyphs, colored surfaces. */
.desktop{color:var(--text,#eee)}.rail .icon{width:18px;height:18px}.rail button{color:var(--accent)}.rail button:hover{background:color-mix(in srgb,var(--accent) 16%,var(--bg))}.panel{width:360px;padding:16px}.panel.wide{width:490px}.panel.corner{width:460px;height:auto}.row{min-height:42px;padding:10px}.video{height:155px}.big{font-size:42px}.panel.session{width:330px}.screen{min-height:116px;padding:14px}.screen .status{margin-bottom:16px}.screen h3{font-size:20px}.nav{margin:12px 0}.panel.ribbon{width:820px}.ribbon-track{display:flex;gap:10px;overflow:auto;align-items:center;height:220px;scroll-snap-type:x mandatory}.poster{min-width:160px;height:178px;padding:0;scroll-snap-align:center;border:2px solid transparent;image-rendering:pixelated}.poster.selected{min-width:260px;height:210px;border-color:var(--accent)}.poster svg{width:100%;height:100%;display:block}.edge-trigger{position:absolute;right:0;top:40%;width:6px;height:120px;z-index:4;padding:0;background:transparent}.edge-trigger:hover{background:var(--accent)}

.action:hover,.nav button:hover,.cartridge:hover,.photo-tile:hover{border-color:var(--accent)}.action:active,.nav button:active,.cartridge:active{transform:translateY(2px);box-shadow:none}.primary{background:var(--accent);color:#101010}.nav{flex-wrap:wrap;gap:6px}.nav button{padding:8px 10px;font-size:12px}.nav button.active,.cartridge.selected,.photo-tile.selected{border:1px solid var(--accent);background:var(--raised);color:var(--accent)}
.panel{clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}.panelhead{margin-bottom:12px;padding-bottom:10px}.rail{justify-content:space-between;gap:0}.rail-zone{display:flex;flex-direction:column;align-items:center;gap:8px}.rail button{border:1px solid transparent;box-shadow:none;clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px)}.rail button:hover{border-color:var(--line);background:var(--raised);box-shadow:inset 0 1px #ffffff22,0 2px #000}.rail button:active{transform:translateY(2px)}.rail button[aria-pressed=true],.rail .slot.selected{box-shadow:none;border-color:var(--accent);background:var(--raised)}.slots{display:grid;gap:4px}.rail .slot{height:28px;min-height:28px;font-size:12px;color:var(--muted)}.rail .slot.selected{color:var(--accent)}.rail .slot .icon{width:16px;height:16px}.rail .clock{font-size:11px;padding:1px}.rail .wizard{height:24px;width:24px}.settings-edge{position:absolute;top:0;left:50%;transform:translateX(-50%);height:6px;width:140px;overflow:hidden;color:transparent;z-index:5}.settings-edge:hover,.settings-edge:focus-visible{height:38px;background:var(--raised);color:var(--accent);border:1px solid var(--line)}
.panel.library{width:672px}.library-body{display:grid;grid-template-columns:190px 1fr;gap:16px}.app-screen{height:124px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;position:relative}.app-screen small{position:absolute;left:10px;top:6px;color:var(--muted)}.app-screen .icon{width:64px;height:64px;color:var(--accent)}#app-readout h3{font-size:23px;font-weight:normal;margin:12px 0 6px}#app-readout .action{width:100%;margin-top:8px}#results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:8px;max-height:280px;overflow:auto}.cartridge{position:relative;min-height:114px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:18px 5px 10px;font-size:12px}.cartridge .icon{width:36px;height:36px;color:var(--accent)}.contacts{position:absolute;top:1px;color:var(--line);font-size:10px;letter-spacing:4px}.panel.ribbon{background:none;border:0;box-shadow:none;clip-path:none;width:960px;padding:0;overflow:hidden}.panel.ribbon:before{display:none}.ribbon-track{height:280px;gap:16px}.poster{min-width:250px;width:250px;height:210px;border:2px solid var(--line)}.poster.selected{min-width:300px;width:300px;height:270px}.ribbon p{text-align:center;margin:8px 0 0;color:white;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000}.session .row{margin-top:6px;border:1px solid var(--line);background:var(--raised)}.panel.studio{width:820px}.studio .field{margin:0}.contact-sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-height:210px;overflow:auto;margin:12px 0}.photo-tile{padding:4px;min-width:0;overflow:hidden;display:grid;gap:4px;text-align:left;font-size:12px}.photo-tile svg{width:100%;height:66px;object-fit:cover}.photo-tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.studio-body{display:grid;grid-template-columns:238px 1fr;gap:18px}.studio-body .nav{margin-top:0}.studio-body .action.primary{width:100%}.studio-body label{margin:1 /* Four-edge illustration; native geometry is tested separately. */
.landscape{inset:0;width:100%}.rail{background:color-mix(in srgb,var(--bg) var(--rail-alpha,100%),transparent);overflow:auto}.rail-zone{flex-shrink:0}.gem{width:14px;height:14px;fill:var(--accent);shape-rendering:crispEdges;opacity:.6}.gem.lit{opacity:1}.rail .clock{min-height:66px;gap:4px;color:var(--text);line-height:1.1}.clock .time{font:12px Pixel}.clock .date{color:var(--accent);font-size:11px}.workspace-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.workspace-board button{display:grid;justify-items:center;gap:6px}.workspace-board small{color:var(--muted);font-size:10px}
.desktop[data-rail=right] .rail{inset:0 0 0 auto}.desktop[data-rail=right] .stage{inset:12px 58px 12px 12px;justify-content:flex-end}.desktop[data-rail=top] .rail,.desktop[data-rail=bottom] .rail{inset:0 0 auto;width:auto;height:44px;flex-direction:row;padding:0 12px}.desktop[data-rail=bottom] .rail{inset:auto 0 0}.desktop[data-rail=top] .rail-zone,.desktop[data-rail=bottom] .rail-zone{flex-direction:row}.desktop[data-rail=top] .slots,.desktop[data-rail=bottom] .slots{display:flex}.desktop[data-rail=top] .clock,.desktop[data-rail=bottom] .clock{min-height:32px;width:110px;display:flex;gap:10px}.desktop[data-rail=top] .clock br,.desktop[data-rail=bottom] .clock br{display:none}.desktop[data-rail=top] .time br:after,.desktop[data-rail=bottom] .time br:after{content:':'}.desktop[data-rail=top] .stage{inset:58px 12px 12px;align-items:flex-start}.desktop[data-rail=bottom] .stage{inset:12px 12px 58px;align-items:flex-end}.desktop .stage.center{justify-content:center;align-items:center}.desktop .stage.right{justify-content:flex-end}.desktop .stage.top{justify-content:center;align-items:flex-start}.desktop .stage.bottom{justify-content:center;align-items:flex-end}.ribbon input[type=range]{display:block;width:min(420px,90%);margin:auto}.contact-sheet{overflow-y:scroll;scrollbar-width:auto}
.clock-colon{display:none;font-weight:normal}.desktop[data-rail=top] .clock-colon,.desktop[data-rail=bottom] .clock-colon{display:inline}

<body>
<header><div><h1>Pixel shell / console revision</h1><p>Layout illustration · sample data · no desktop actions</p></div><div class="tools"><label>Theme <select id="theme"><option value="balanced">Balanced</option><option value="wallpaper">Tinted</option><option value="black">True black</option><option value="light">Paper</option></select></label><label>Accent <select id="accent"><option value="#d7ba82">Amber</option><option value="#b1c89a">Sage</option><option value="#a7bddb">Blue</option></select></label><label>Rail <select id="rail-edge"><option>left</option><option>right</option><option>top</option><option>bottom</option></select></label><label>Launcher <select id="edge"><option value="top">Top</option><option value="bottom">Bottom</option><option value="center">Center</option></select></label></div></header>
<main><nav class="tabs" aria-label="Review scenes" id="tabs"></nav>
<div class="desktop" id="desktop">
<svg class="landscape" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1000" height="700" fill="#29352f"/><path d="M0 410H90V370H180V310H260V260H320V220H400V280H470V320H540V360H620V400H740V360H820V310H920V280H1000V700H0Z" fill="#38483d"/><path d="M0 550H130V490H210V460H320V430H430V480H550V520H630V470H720V430H820V470H940V530H1000V700H0Z" fill="#1d2d25"/><path d="M0 640H180V590H280V620H390V660H580V610H710V570H830V600H1000V700H0Z" fill="#14231c"/><rect x="760" y="130" width="44" height="44" fill="#7c8771"/></svg>
<button class="edge-trigger" id="edge-trigger" aria-label="Quick wallpapers"></button><button class="settings-edge" data-scene="Your corner" aria-label="Settings">↓ Settings</button><aside class="rail" id="rail" aria-label="Shell rail"></aside><div class="stage" id="stage"></div><span class="caption">Illustration — not a native screenshot</span></div><p class="note" id="note"></p>
</main>
<script>
const scenes=['Rail','Workspaces','Library','Quick wallpapers','Wallpaper studio','Image browser','Wireless','Bluetooth','Your day','Sound','Tray','Session','Your corner'];
const $=id=>document.getElementById(id);
const icon=name=>`<i class="icon" aria-hidden="true" style="--icon:url('assets/icons/${name}.svg')"></i>`;
const row=(name,ico,detail='',extra='')=>`<button class="row" ${extra}>${icon(ico)}<span>${name}${detail?`<small>${detail}</small>`:''}</span></button>`;
const nav=(names,active,attr)=>`<div class="nav">${names.map(n=>`<button class="${n===active?'active':''}" ${attr}="${n}">${n}</button>`).join('')}</div>`;
let scene='Library',wifi='Link',bt='Device',day='Day',corner='Look',pending='',selectedDay=21,selectedApp=0;
const notes={Workspaces:"All workspaces, independent of the rail slot count. These twelve spaces and windows are illustrative only.",'Wallpaper studio':'A full-width contact sheet and compact palette workbench. No empty left column. Native app sync remains separately confirmed.', 'Image browser':'Image thumbnails, a selected-image preview and explicit confirmation. Native navigation uses your local filesystem.','Quick wallpapers':'Right-edge ribbon · scroll to browse, click or Enter to apply. Super+Ctrl+W in the native shell.',Rail:'Smaller, wallpaper-tinted icons with quiet hover feedback. Settings reveals at the top edge; no hidden rail slot.',Library:'Cartridge shelf with a selected-app readout. Arrows browse; Enter launches. The native version launches your installed apps.',Wireless:'One inset signal screen, then a focused Link / Scan / Join flow. The real shell uses NetworkManager.',Bluetooth:'A separate link-device screen. Native PIN/passkey pairing stays in Blueman.', 'Your day':'Day, History and Apps are separate pages. This illustration uses sample data, not your activity.',Sound:'Mute, volume, output and brightness. Nothing nested behind an unexplained arrow.',Tray:'Third-party apps live together. Bundled identity symbols avoid missing-icon provider textures.',Session:'Your existing video remains in native Power. This browser illustration does not include your personal video.', 'Your corner':'Shared cut-corner keys, module placement and open preference sections. Native changes save live.'};
$('tabs').innerHTML=scenes.map(s=>`<button data-scene="${s}">${s}</button>`).join('');
const railLayout={top:['launcher','workspaces'],middle:['wizard','media','clock'],bottom:['audio','system','battery','network','bluetooth','tray','settings','power']};
const hiddenModules=new Set(['system','settings']);
const railLabels={launcher:'Library',workspaces:'Workspaces',wizard:'Wizard',media:'Media',clock:'Clock',audio:'Sound',system:'System',battery:'Energy',network:'Wireless',bluetooth:'Bluetooth',tray:'Tray',settings:'Settings',power:'Session'};
let activeWorkspace=1, anchorY=null, appCategory='All';
function gem(active,occupied){const rows=active?['0001000','0011100','0111110','1111111','0111110','0011100','0001000']:occupied?['0001000','0010100','0101010','1011101','0101010','0010100','0001000']:['0001000','0010100','0100010','1000001','0100010','0010100','0001000'];return `<svg class="gem ${active?'lit':''}" viewBox="0 0 7 7" aria-hidden="true">${rows.flatMap((r,y)=>[...r].map((v,x)=>v==='1'?`<rect x="${x}" y="${y}" width="1" height="1"/>`:'')).join('')}</svg>`}
function renderRail(){
 const glyph={launcher:'nixos',media:'music',audio:'volume-2',system:'cpu',battery:'battery-full',network:'wifi',bluetooth:'bluetooth',tray:'database',settings:'settings-2',power:'power'};
 const target={launcher:'Library',audio:'Sound',network:'Wireless',bluetooth:'Bluetooth',tray:'Tray',settings:'Your corner',power:'Session'};
 $('rail').innerHTML=Object.entries(railLayout).map(([zone,items])=>`<div class="rail-zone" data-zone="${zone}">${items.filter(k=>!hiddenModules.has(k)).map(k=>k==='workspaces'?`<div class="slots">${[1,2,3,4,activeWorkspace>5?activeWorkspace:5].map(i=>`<button data-workspace="${i}" class="slot ${activeWorkspace===i?'selected':''}" aria-label="Workspace ${i}">${gem(i===activeWorkspace,i<3)}</button>`).join('')}<button data-scene="Workspaces" aria-label="Manage all workspaces">${icon('app-windows')}</button></div>`:k==='wizard'?'<button data-scene="Wallpaper studio" aria-label="Wallpaper wizard"><img class="wizard" src="assets/wizard.png" alt=""></button>':k==='clock'?'<button class="clock" data-scene="Your day" aria-label="Clock and Your day"><span class="time">09<b class="clock-colon">:</b><br>41</span><span class="date">21<br> SEP</span></button>':`<button ${target[k]?`data-scene="${target[k]}"`:'data-demo="This module uses live desktop data in the native shell."'} aria-label="${railLabels[k]}">${icon(glyph[k])}</button>`).join('')}</div>`).join('');
}
renderRail();
function photo(i){return `<svg viewBox="0 0 260 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="260" height="210" fill="${['#48513b','#5b4059','#314d64','#704835','#484c48'][i%5]}"/><rect x="190" y="30" width="24" height="24" fill="#d5b880"/><path d="M0 140H30V110H65V85H100V60H140V100H185V130H225V100H260V210H0Z" fill="#111b20"/><path d="M0 180H55V165H110V185H170V160H225V175H260V210H0Z" fill="#0c1519"/></svg>`}
function contactSheet(){return '<div class="contact-sheet">'+['Moss','Dusk','Blue hour','Ember','Stone','Hill','Night','Coast','Lantern','Field'].map((n,i)=>`<button class="photo-tile" data-photo="${i}" aria-label="${n}">${photo(i)}<span>${n}.png</span></button>`).join('')+'</div>'}
function selectPoster(index,apply=false){const posters=[...document.querySelectorAll('.poster')];index=Math.max(0,Math.min(posters.length-1,index));const b=posters[index];if(!b)return;posters.forEach(el=>el.classList.toggle('selected',el===b));$('poster-name').textContent=b.getAttribute('aria-label');if($('poster-scrub'))$('poster-scrub').value=index;b.scrollIntoView?.({block:'nearest',inline:'center'});if(apply){$('accent').value=['#b1c89a','#d7ba82','#a7bddb','#d7ba82','#b1c89a'][index];paintTheme();}}

function head(title,sub=''){return `<div class="panelhead"><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div><button data-close aria-label="Close">×</button></div>`}
function screen(status,title,detail,ico){return `<div class="screen"><div class="status">${status}</div><div class="flex">${icon(ico)}<div><h3>${title}</h3><span class="muted small">${detail}</span></div></div></div>`}
function render(animate=true){
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));
