<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel shell · console revision</title>
<style>
@font-face{font-family:Pixel;src:url('assets/pixel.ttf')}*{box-sizing:border-box}body{margin:0;background:#171918;color:#e9e9e3;font:14px/1.5 monospace}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--accent,#d7ba82);outline-offset:2px}header,main{max-width:1360px;margin:auto;padding:26px 32px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1,h2{font:14px/1.6 Pixel,monospace;margin:0}p{margin:8px 0}header p,.note{color:#a4aaa3;font-size:12px}.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.tools select{background:#242724;border:1px solid #464b43;padding:6px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:16px}.tabs button{padding:10px 12px;white-space:nowrap;color:#a4aaa3}.tabs button[aria-pressed=true]{color:#e9e9e3;border-bottom:2px solid #d7ba82}.desktop{--accent:#d7ba82;--bg:#000;--surface:#0c0c0b;--raised:#20211e;--line:#373933;--muted:#a4aaa3;position:relative;height:730px;border:6px solid var(--bg);background:#29352f;overflow:hidden;color:#eceee6}.desktop.light{--bg:#e7e6dc;--surface:#f4f3e9;--raised:#d8dccf;--line:#b0b5a6;--muted:#50594b;color:#252b20}.landscape{position:absolute;inset:0 0 0 44px;width:calc(100% - 44px);height:100%}.rail{position:absolute;inset:0 auto 0 0;width:44px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;z-index:3}.rail button{width:32px;min-height:32px;padding:5px;display:grid;place-items:center;color:var(--muted)}.rail button[aria-pressed=true]{color:var(--accent);box-shadow:inset 2px 0 var(--accent)}.icon{width:22px;height:22px;display:inline-block;background:currentColor;mask:var(--icon) center/contain no-repeat}.rail .space{flex:1}.workspace{width:4px;height:4px;background:var(--line);margin:7px}.workspace.active{width:16px;height:2px;background:var(--accent)}.clock{font-size:13px;line-height:1.4}.wizard{image-rendering:pixelated;width:24px;height:34px;object-fit:contain}.stage{position:absolute;inset:12px 12px 12px 58px;display:flex;align-items:center;justify-content:flex-start;z-index:2;pointer-events:none}.panel{pointer-events:auto;background:var(--surface);border:1px solid var(--line);width:410px;max-width:100%;max-height:100%;overflow:auto;padding:20px;position:relative;scrollbar-width:thin;scrollbar-color:var(--line) var(--surface)}.panel:before{content:'';position:absolute;left:0;top:0;width:18px;height:2px;background:var(--accent)}.panelhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}.panelhead button{font-size:20px;color:var(--muted);padding:0 5px}.panelhead small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.stage.center{justify-content:center}.stage.right{justify-content:flex-end}.stage.top{align-items:flex-start;justify-content:center}.stage.bottom{align-items:flex-end;justify-content:center}.panel.wide{width:560px}.panel.corner{width:480px;height:100%}.panel.enter{animation:appear .18s ease-out}.stage.top .enter{animation-name:fromtop}.stage.bottom .enter{animation-name:frombottom}.stage.right .enter{animation-name:fromright}@keyframes appear{from{opacity:0}}@keyframes fromtop{from{transform:translateY(-110%)}}@keyframes frombottom{from{transform:translateY(110%)}}@keyframes fromright{from{transform:translateX(110%)}}@media(prefers-reduced-motion:reduce){.panel.enter{animation:none}}.muted{color:var(--muted)}.small{font-size:12px}.flex{display:flex;align-items:center;justify-content:space-between;gap:16px}.nav{display:flex;gap:14px;margin:18px 0}.nav button{padding:8px 0;color:var(--muted)}.nav button.active{color:var(--accent);border-bottom:2px solid var(--accent)}.row{width:100%;min-height:48px;padding:12px;display:flex;align-items:center;gap:16px;text-align:left}.row:hover,.row.selected{background:var(--raised)}.row .icon{color:var(--accent)}.row>span:nth-child(2){flex:1}.row small{display:block;color:var(--muted)}.row.selected{box-shadow:inset 2px 0 var(--accent)}.action{padding:8px 12px;min-height:36px}.action:hover{background:var(--raised)}.primary{background:var(--accent);color:#14150f}.screen{border:1px solid var(--line);background:var(--bg);padding:18px;margin-bottom:12px;min-height:155px}.screen .status{font:10px Pixel;color:var(--muted);margin-bottom:24px}.status:before{content:'■';color:var(--accent);margin-right:10px}.screen h3{font:23px monospace;margin:0 0 4px}.screen .icon{width:30px;height:30px;color:var(--accent)}.screen .flex{justify-content:flex-start}.props{display:grid;grid-template-columns:1fr auto;gap:16px;margin:22px 0}.props span:nth-child(odd){color:var(--muted)}.field{width:100%;background:var(--bg);border:1px solid var(--line);padding:12px;margin-bottom:14px}input[type=range]{accent-color:var(--accent);width:100%}.big{font:52px monospace;margin:14px 0 0}.meter{display:flex;gap:5px;margin:22px 0 10px}.meter i{height:6px;flex:1;background:var(--raised)}.meter i.on{background:var(--accent)}.graph{display:flex;height:110px;align-items:flex-end;gap:8px;margin:24px 0 8px}.graph button{flex:1;background:var(--accent);min-height:3px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.calendar button{height:30px;background:color-mix(in srgb,var(--accent) var(--heat),var(--raised));color:var(--text,#eee)}.calendar button:nth-child(3n){color:#12150e}.progress{height:4px;background:var(--raised);margin:8px 0 22px}.progress:after{content:'';display:block;width:var(--share);height:100%;background:var(--accent)}.video{background:#000;border:1px solid var(--line);height:190px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;text-align:center}.video p{font:11px/1.8 Pixel;color:var(--accent)}.profile{padding:16px 0;display:flex;align-items:center;gap:14px}.profile .icon{width:36px;height:36px;color:var(--accent)}.heading{padding:18px 0 12px;border-top:1px solid var(--line);margin-top:20px}.note{min-height:36px;margin-top:16px}.caption{position:absolute;bottom:8px;right:12px;color:#bbc6bc;font-size:11px}.sheetempty{font:12px Pixel;color:#c8d0c5;align-self:flex-end;margin:0 0 35px 20px}.spaced{margin:24px 0}.danger{color:#edac9b}@media(max-width:700px){header,main{padding:18px 12px}header{display:block}.tools{margin-top:15px}.desktop{height:700px}.panel{padding:16px}.stage{inset:8px 8px 8px 52px}.nav{gap:10px}.nav button{font-size:12px}}
</style>
</head>
<body>
<header><div><h1>Pixel shell / console revision</h1><p>Layout illustration · sample data · no desktop actions</p></div><div class="tools"><label>Theme <select id="theme"><option value="black">True black</option><option value="light">Paper</option></select></label><label>Accent <select id="accent"><option value="#d7ba82">Amber</option><option value="#b1c89a">Sage</option><option value="#a7bddb">Blue</option></select></label><label>Launcher <select id="edge"><option value="top">Top</option><option value="bottom">Bottom</option><option value="center">Center</option></select></label></div></header>
<main><nav class="tabs" aria-label="Review scenes" id="tabs"></nav>
<div class="desktop" id="desktop">
<svg class="landscape" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="1000" height="700" fill="#29352f"/><path d="M0 410H90V370H180V310H260V260H320V220H400V280H470V320H540V360H620V400H740V360H820V310H920V280H1000V700H0Z" fill="#38483d"/><path d="M0 550H130V490H210V460H320V430H430V480H550V520H630V470H720V430H820V470H940V530H1000V700H0Z" fill="#1d2d25"/><path d="M0 640H180V590H280V620H390V660H580V610H710V570H830V600H1000V700H0Z" fill="#14231c"/><rect x="760" y="130" width="44" height="44" fill="#7c8771"/></svg>
<aside class="rail" id="rail" aria-label="Shell rail"></aside><div class="stage" id="stage"></div><span class="caption">Illustration — not a native screenshot</span></div><p class="note" id="note"></p>
</main>
<script>
const scenes=['Rail','Library','Wireless','Bluetooth','Your day','Sound','Tray','Session','Your corner'];
const $=id=>document.getElementById(id);
const icon=name=>`<i class="icon" aria-hidden="true" style="--icon:url('assets/icons/${name}.svg')"></i>`;
const row=(name,ico,detail='',extra='')=>`<button class="row" ${extra}>${icon(ico)}<span>${name}${detail?`<small>${detail}</small>`:''}</span></button>`;
const nav=(names,active,attr)=>`<div class="nav">${names.map(n=>`<button class="${n===active?'active':''}" ${attr}="${n}">${n}</button>`).join('')}</div>`;
let scene='Wireless',wifi='Link',bt='Device',day='Day',corner='Look',pending='',selectedDay=21,selectedApp=0;
const notes={Rail:'One slim rail. No hover labels or permanent boxes; small marks show selection.',Library:'Search-first library. Top and bottom slide; center fades. The native version launches your installed apps.',Wireless:'One inset signal screen, then a focused Link / Scan / Join flow. The real shell uses NetworkManager.',Bluetooth:'A separate link-device screen. Native PIN/passkey pairing stays in Blueman.', 'Your day':'Day, History and Apps are separate pages. This illustration uses sample data, not your activity.',Sound:'Mute, volume, output and brightness. Nothing nested behind an unexplained arrow.',Tray:'Third-party apps live together. Bundled identity symbols avoid missing-icon provider textures.',Session:'Your existing video remains in native Power. This browser illustration does not include your personal video.', 'Your corner':'Underline navigation and open sections instead of a stack of boxed cards. Native changes save live.'};
$('tabs').innerHTML=scenes.map(s=>`<button data-scene="${s}">${s}</button>`).join('');
$('rail').innerHTML=`<button data-scene="Library" aria-label="Library">${icon('nixos')}</button><span class="workspace active"></span><span class="workspace"></span><span class="workspace"></span><span class="workspace"></span><span class="workspace"></span><button class="clock" data-scene="Your day" aria-label="Your day">09<br>41</button><span class="space"></span><img class="wizard" src="assets/wizard.png" alt="Original wizard"><span class="space"></span>${[['Sound','volume-2'],['Wireless','wifi'],['Bluetooth','bluetooth'],['Tray','app-windows'],['Session','power'],['Your corner','settings-2']].map(([s,i])=>`<button data-scene="${s}" aria-label="${s}">${icon(i)}</button>`).join('')}`;
function head(title,sub=''){return `<div class="panelhead"><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div><button data-close aria-label="Close">×</button></div>`}
function screen(status,title,detail,ico){return `<div class="screen"><div class="status">${status}</div><div class="flex">${icon(ico)}<div><h3>${title}</h3><span class="muted small">${detail}</span></div></div></div>`}
function render(animate=true){
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));
 $('note').textContent=notes[scene];
 const stage=$('stage'); stage.className='stage'; let html='',title=scene,sub='',cls='';
 if(scene==='Rail'){stage.innerHTML='<div class="sheetempty">Ready when you are.</div>';return}
 if(scene==='Library'){
  title='Library';cls='wide';stage.classList.add($('edge').value);html='<input id="search" class="field" placeholder="Find an app" aria-label="Find an app"><div id="results"></div><p class="muted small">↑ ↓ to choose · Enter · Esc</p>';
 } else if(scene==='Wireless'){
  html=screen(wifi==='Join'?'Connect':'Link ready',wifi==='Join'?'Guest network':'Home Wi-Fi',wifi==='Join'?'Secured network':'192.168.1.24','wifi')+nav(['Link','Scan'],wifi,'data-wifi');
  if(wifi==='Link')html+='<div class="props"><span>Internet</span><span>Online</span><span>Signal</span><span>▂▄▆█　84%</span><span>Security</span><span>WPA2</span></div><button class="action" data-wifi="Scan">Change network</button>';
  else if(wifi==='Scan')html+='<div class="flex muted small"><span>3 signals found</span><button class="action" data-wifi="Scan">Scan again</button></div>'+row('Home Wi-Fi','wifi','Connected · 84%','data-wifi="Link"')+row('Guest network','wifi','Secured · 62%','data-wifi="Join"')+row('Pocket hotspot','wifi','Secured · 29%','data-wifi="Join"');
  else html+='<input class="field" type="password" placeholder="Password" aria-label="Password"><div class="flex"><button class="action" data-wifi="Scan">Back</button><button class="action primary" data-wifi="Link">Connect · demo</button></div>';
 } else if(scene==='Bluetooth'){
  title='Link cable';sub='Bluetooth';html=screen(bt==='Device'?'Connected':'Discovering',bt==='Device'?'Pocket headphones':'Bluetooth',bt==='Device'?'8C:42:00:21:AB:10':'Select a device to link.','bluetooth')+nav(['Device','Nearby'],bt,'data-bt');
  html+=bt==='Device'?'<div class="props"><span>Status</span><span>Connected</span><span>Battery</span><span>72%</span></div><button class="action" data-bt="Nearby">Nearby devices</button>':row('Pocket headphones','bluetooth','Saved device','data-bt="Device"')+row('Controller','gamepad','Ready to pair','data-demo="Pairing opens Blueman in the native shell."');
 } else if(scene==='Your day'){
  cls='wide';sub='Sample history';stage.classList.add('center');html=nav(['Day','History','Apps'],day,'data-day');
  if(day==='Day')html+=`<p class="muted">${selectedDay===21?'Today':'September '+selectedDay}</p><div class="big">3h 24m</div><p class="muted">Focused time</p><div class="meter">${Array.from({length:16},(_,i)=>`<i class="${i<13?'on':''}"></i>`).join('')}</div><p class="muted small">Reference goal / 4h</p><div class="spaced">${row('Firefox','globe','1h 42m','data-day="Apps"')+row('Terminal','terminal','1h 08m','data-day="Apps"')+row('Emacs','braces','34m','data-day="Apps"')}</div><button class="action" data-day="Apps">All apps</button>`;
  else if(day==='History')html+='<div class="flex"><span>Last 7 days</span><span>23h 48m</span></div><div class="graph">'+[45,60,28,78,48,91,62].map((h,i)=>`<button style="height:${h}%" data-date="${15+i}" aria-label="September ${15+i}"></button>`).join('')+'</div><p class="muted small">3h 24m / recorded day · 64h retained total</p><p class="spaced">September 2026</p><div class="calendar">'+Array.from({length:30},(_,i)=>`<button data-date="${i+1}" style="--heat:${i%5*18}%" ${i>20?'disabled':''}>${i+1}</button>`).join('')+'</div><p class="muted small">Less ░ ▒ ▓ █ More · blank = no data</p>';
  else html+='<p class="muted">Selected day · most used</p>'+[['Firefox','1h 42m',50],['Terminal','1h 08m',33],['Emacs','34m',17]].map(([n,t,p])=>`<div class="flex"><span>${n}</span><span class="muted">${t} / ${p}%</span></div><div class="progress" style="--share:${p*2}%"></div>`).join('');
 } else if(scene==='Sound'){
  title='Sound & light';html='<div class="flex">'+icon('volume-2')+'<span>Volume</span><span>64%</span></div><input type="range" value="64" aria-label="Volume"><div class="spaced"><p class="muted small">Output</p><button class="row" data-demo="The native output row opens pavucontrol.">Built-in speakers</button></div><div class="flex"><span>Brightness</span><span>72%</span></div><input type="range" value="72" aria-label="Brightness">';
 } else if(scene==='Tray'){
  title='Background apps';html=row('Cloudflare WARP','globe','', 'data-demo="The native shell activates WARP or opens its menu."')+row('udiskie','database','','data-demo="The native shell opens udiskie’s exported menu."')+row('Steam','gamepad','','data-demo="The native shell activates Steam."');
 } else if(scene==='Session'){
  stage.classList.add('right');html='<div class="video"><p>Your video plays here<br><span class="muted small">Native preview uses your configured path</span></p></div><div class="profile">'+icon('user')+'<span>Player one</span></div>';
  html+=pending?`<h2>${pending}?</h2><p class="muted spaced">Save your progress before ending this session.</p><div class="flex"><button class="action" id="cancel" data-power="">Keep playing</button><button class="action danger" data-demo="Preview only — no session action was executed.">${pending}</button></div>`:['Lock','Sleep','Log out','Restart','Shut down'].map(n=>row(n,n==='Lock'?'lock':n==='Sleep'?'clock':'power','',n==='Lock'||n==='Sleep'?'data-demo="Preview only — no session action was executed."':`data-power="${n}"`)).join('');
 } else if(scene==='Your corner'){
  stage.classList.add('right');cls='corner';html='<div class="profile">'+icon('user')+'<div>Player one<p class="muted small">A little magic, every day.</p></div></div>'+nav(['Profile','Bar','Look','Audio','Data'],corner,'data-corner');
  if(corner==='Look')html='<div class="profile">'+icon('user')+'<span>Player one</span></div>'+nav(['Profile','Bar','Look','Audio','Data'],corner,'data-corner')+'<p class="heading">Frame & type</p><div class="flex"><span>Frame</span><span>6 px</span></div><input type="range" min="4" max="10" value="6" aria-label="Frame width" id="frame"><p class="heading">Motion</p><div class="flex"><span>Duration</span><span>180 ms</span></div><input type="range" min="80" max="350" value="180" aria-label="Motion duration"><p class="heading">Library position</p>'+nav(['Top','Bottom','Center'],$ ('edge').value[0].toUpperCase()+$('edge').value.slice(1),'data-edge');
  else if(corner==='Profile')html+='<p class="muted small">Display name</p><input class="field" value="Player one" aria-label="Display name"><p class="muted small">Short note</p><input class="field" value="A little magic, every day." aria-label="Short note">';
  else if(corner==='Bar')html+='<p class="muted small">Native Settings offers twelve individual module switches.</p>'+['Launcher','Workspaces','Clock','Wizard','Media','Sound','System','Battery','Network','Bluetooth','Tray','Power'].map(n=>`<label class="row"><input type="checkbox" checked> ${n}</label>`).join('');
  else html+=`<p class="heading">${corner==='Audio'?'Workspace audio':'Local history'}</p><label><input type="checkbox"> Enable ${corner==='Audio'?'workspace stream control':'focused-app history'}</label><p class="muted small spaced">Off by default in the native shell. This browser control does not save data or change your desktop.</p>`;
 }
 stage.innerHTML=`<section class="panel ${cls} ${animate?'enter':''}" aria-label="${title}">${head(title,sub)}${html}</section>`;
 if(scene==='Library'){selectedApp=0;apps();$('search').addEventListener('input',()=>{selectedApp=0;apps()});$('search').addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();selectedApp=Math.max(0,Math.min(filteredApps().length-1,selectedApp+(e.key==='ArrowDown'?1:-1)));apps()}if(e.key==='Enter')$('note').textContent='Illustration only — no application was launched.'});$('search').focus()}
 if(pending&&scene==='Session')$('cancel').focus();
 if($('frame'))$('frame').oninput=e=>$('desktop').style.borderWidth=e.target.value+'px';
}
const appNames=['Emacs','Firefox','Foot','Kitty','Steam','Thunar'];
function filteredApps(){return appNames.filter(a=>a.toLowerCase().includes($('search').value.toLowerCase()))}
function apps(){$('results').innerHTML=filteredApps().map((a,i)=>row(a,a==='Firefox'?'globe':a==='Steam'?'gamepad':a==='Thunar'?'folder':a==='Emacs'?'braces':'terminal','','data-demo="Illustration only — no application was launched."').replace('class="row"',`class="row ${i===selectedApp?'selected':''}"`)).join('')||'<p class="muted">No matching apps.</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if('scene'in d){scene=d.scene;pending='';render()}
 else if('close'in d){scene='Rail';pending='';render()}
 else if('wifi'in d){wifi=d.wifi;render(false)}else if('bt'in d){bt=d.bt;render(false)}else if('day'in d){day=d.day;render(false)}else if('date'in d){selectedDay=+d.date;day='Day';render(false)}else if('corner'in d){corner=d.corner;render(false)}else if('power'in d){pending=d.power;render(false)}else if('edge'in d){$('edge').value=d.edge.toLowerCase();render(false)}else if('demo'in d){$('note').textContent=d.demo}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pending)pending='';else scene='Rail';render(false)}});
$('theme').onchange=e=>$('desktop').classList.toggle('light',e.target.value==='light');
$('accent').onchange=e=>$('desktop').style.setProperty('--accent',e.target.value);
$('edge').onchange=()=>{scene='Library';render()};render();
</script>
</body></html>
